<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101418">
<title>TunedUp</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app">

  <!-- Start. Holding the button IS the room measurement: one control, no
       separate calibration step, and the thing you wait for is the thing the
       tuner needs. -->
  <section id="start" class="screen">
    <h1>TunedUp</h1>
    <button id="hold" class="hold" aria-describedby="hold-hint">
      <span class="hold-fill" id="hold-fill"></span>
      <span class="hold-label" id="hold-label">Hold to start</span>
    </button>
    <p id="hold-hint" class="hint">Stay quiet while it listens to your room.</p>
    <p id="start-error" class="error" hidden></p>
  </section>

  <!-- Tuning. -->
  <section id="tuner" class="screen" hidden>
    <div class="note-row">
      <span id="note" class="note idle">&middot;</span><span id="octave" class="octave"></span>
    </div>

    <div class="meter" id="meter">
      <div class="meter-track">
        <div class="meter-target"></div>
        <div class="meter-ticks" id="ticks"></div>
        <div class="meter-band" id="band"></div>
        <div class="meter-needle" id="needle"></div>
      </div>
      <div class="meter-scale"><span>&minus;50</span><span>0</span><span>+50</span></div>
    </div>

    <div class="cents-row">
      <span id="cents" class="cents">&nbsp;</span>
      <span id="direction" class="direction"></span>
    </div>

    <p id="status" class="status">Play a string.</p>

    <footer class="controls">
      <button id="recalibrate" class="ghost">Re-read the room</button>
      <button id="ref" class="ghost" aria-label="Reference pitch">A4 = <span id="ref-value">440</span></button>
    </footer>
  </section>

</main>
<script type="module" src="app.js"></script>
</body>
</html>
