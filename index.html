<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>TunedUp</title>
<meta name="description" content="A simple, accurate chromatic instrument tuner that runs in your browser." />
<meta name="theme-color" content="#0b0d10" />
<meta name="color-scheme" content="dark" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="TunedUp" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<main id="app" class="state-idle">

  <header class="topbar">
    <div class="wordmark">TunedUp</div>
  </header>

  <div class="stage">
    <section class="readout" aria-live="polite">
      <div class="note">
        <span id="noteName" class="note-name"></span><span id="noteOctave" class="note-octave"></span>
      </div>
      <div id="centsText" class="cents"></div>
    </section>

    <section class="gauge-wrap">
      <svg class="gauge" viewBox="0 0 300 186" role="img" aria-label="Tuning meter">
        <g id="ticks"></g>
        <path class="arc" d="M 39.1 109.6 A 118 118 0 0 1 260.9 109.6" />
        <g id="needle" class="needle">
          <line x1="150" y1="150" x2="150" y2="54" />
          <circle cx="150" cy="150" r="7" />
        </g>
        <circle id="target" class="target" cx="150" cy="22" r="4" />
      </svg>
      <div id="hint" class="hint">Play a single note</div>
    </section>
  </div>

  <footer class="footer">
    <div id="detailText" class="detail"></div>

    <div class="controls">
      <label class="chip">
        <span class="chip-label">Reference</span>
        <select id="refSelect" aria-label="Reference pitch"></select>
      </label>
      <label class="chip">
        <span class="chip-label">Mode</span>
        <select id="modeSelect" aria-label="Detection mode"></select>
      </label>
      <label class="chip">
        <span class="chip-label">String</span>
        <select id="stringSelect" aria-label="Target string"></select>
      </label>
    </div>

    <p id="modeBlurb" class="blurb"></p>
    <div class="actions">
      <button id="startBtn" class="start" type="button">Start tuning</button>
      <button id="traceBtn" class="link" type="button">Trace</button>
    </div>
    <p id="errorText" class="error" hidden></p>
  </footer>

</main>

<section id="tracePanel" class="panel" hidden>
  <header class="panel-top">
    <h2 class="panel-title">Last pluck</h2>
    <button id="traceClose" class="link" type="button">Close</button>
  </header>
  <svg id="traceChart" class="trace-chart" viewBox="0 0 360 262" role="img" aria-label="Pitch over time since the pluck"></svg>
  <p id="traceReadout" class="trace-readout"></p>
  <dl id="traceStats" class="trace-stats"></dl>
  <button id="saveBtn" class="save" type="button">Save recording (WAV)</button>
  <p class="panel-note">Saves the last 15 seconds of audio. Send me the file and I can replay it through every mode.</p>
</section>

<script type="module" src="./app.js"></script>
</body>
</html>
